name: Apply RATHOD VIP Bot Upgrade

on:
  workflow_dispatch:
  push:
    paths:
      - 'vip_question_engine.py'
      - 'persistent_scores.py'
      - 'app_update_notifier.py'
      - 'apply_vip_bot.py'
      - '.github/workflows/apply-vip-bot.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire VIP engine, persistent scores, notifications and validate Python
        run: |
          python apply_vip_bot.py
          python -m py_compile main.py quiz.py vip_question_engine.py persistent_scores.py app_update_notifier.py apply_vip_bot.py
          grep -q 'vip_question_engine.install' main.py
          grep -q 'persistent_scores.install' main.py
          grep -q 'app_update_notifier.init' main.py
          grep -q 'CommandHandler("qtypes"' main.py
          grep -q 'CommandHandler("chatid"' main.py
          grep -q 'CommandHandler("testupdate"' main.py
      - name: Commit generated wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py vip_question_engine.py persistent_scores.py app_update_notifier.py apply_vip_bot.py
          git diff --cached --quiet && exit 0
          git commit -m "Enable automatic RATHOD HUB Telegram update alerts [skip ci]"
          git push
