name: Apply Telegram Score Integration
on:
  workflow_dispatch:
  push:
    paths: ['patch_bot.py','supabase_sync.py','.github/workflows/apply-telegram-score.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python patch_bot.py
      - run: python -m py_compile main.py quiz.py config.py supabase_sync.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py quiz.py config.py supabase_sync.py
          git diff --cached --quiet && exit 0
          git commit -m "Integrate Telegram quiz XP with RATHOD HUB"
          git push
